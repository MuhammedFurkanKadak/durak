<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Durak – İstanbul Toplu Taşıma</title>
<meta name="description" content="Reklamsız İstanbul toplu taşıma: metro, Marmaray, tramvay, vapur, minibüs ve dolmuş hatları, sefer saatleri ve nasıl giderim.">
<meta name="theme-color" content="#1f4fd8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Durak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>try{if(navigator.standalone===true||matchMedia("(display-mode: standalone)").matches)document.documentElement.style.setProperty("--satmin",/iphone|ipad|ipod/i.test(navigator.userAgent)?"50px":"0px")}catch(e){}
try{document.documentElement.dataset.theme=localStorage.getItem("durak-tema")==="dark"?"dark":"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#eef2f8; --card:#ffffff; --ink:#0f1b33; --muted:#5a6578; --line:#dbe2ee;
  --brand:#1f4fd8; --brand-ink:#ffffff; --radius:16px; --hdrbg:#1f4fd8; --hdrink:#ffffff; --dest:#f2b705;
}
/* Gece modu (sağ üstteki düğmeyle) */
:root[data-theme="dark"]{
  --bg:#0e131d; --card:#182131; --ink:#eef3fb; --muted:#9aa8bd; --line:#26324a;
  --brand:#4cc2ff; --brand-ink:#06121c; --hdrbg:#0e131d; --hdrink:#eef3fb;
  color-scheme:dark;
}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
:root[data-theme="dark"] .leaflet-container{background:#0e131d}
:root[data-theme="dark"] .leaflet-bar a{background:var(--card);color:var(--ink);border-color:var(--line)}
:root[data-theme="dark"] .leaflet-control-attribution{background:rgba(14,19,29,.75)!important;color:var(--muted)}
:root[data-theme="dark"] .leaflet-popup-content-wrapper,:root[data-theme="dark"] .leaflet-popup-tip{background:var(--card);color:var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:max(env(safe-area-inset-top),var(--satmin,0px)) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;gap:10px;margin:-12px -16px 14px;padding:16px 16px 18px;background:var(--hdrbg);color:var(--hdrink);box-shadow:0 0 0 100vmax var(--hdrbg);clip-path:inset(-100vmax -100vmax 0 -100vmax)}
.inst{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.inst b{display:block;font-size:14px}
.inst .go{margin-left:auto;border:0;border-radius:10px;padding:9px 12px;background:var(--brand);color:var(--brand-ink);font:700 13px Inter,system-ui,sans-serif;cursor:pointer;flex:none}
.inst .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;flex:none}
.guide{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:5000;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(70px + env(safe-area-inset-bottom))}
.gbox{position:relative;background:var(--card);color:var(--ink);border-radius:20px;padding:18px 18px 14px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.gbox p{font-size:14px;color:var(--muted);margin-top:10px}
.gbox ol{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.gbox li{display:flex;align-items:center;gap:12px;font-size:15px;line-height:1.35}
.gn{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.gi{min-width:44px;height:44px;padding:0 6px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--brand);flex:none}
.gx{position:absolute;top:8px;right:10px;border:0;background:none;font-size:26px;color:var(--muted);cursor:pointer;width:44px;height:44px}
.gcopy{margin-top:12px;width:100%;border:0;border-radius:12px;padding:12px;background:var(--brand);color:var(--brand-ink);font:700 15px Inter,system-ui,sans-serif;cursor:pointer}
.gs{font-size:12.5px!important}
.garrow{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:40px;font-weight:800;color:#fff;animation:gb 1s ease-in-out infinite}
@keyframes gb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
.trip .hico{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);display:grid;place-items:center;flex:none}
.trip .hico.f{background:color-mix(in srgb,#f2b705 22%,transparent);color:#b8860b}
.trip .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip .t span{font-size:12.5px;color:var(--muted)}
.trip .t{flex:1;min-width:0}
.favlines{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.favlines .fl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.favlines .fl span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapview.det #homeback,#mapview.nav #homeback{display:none}
#homeback{margin:0 0 6px}
[hidden]{display:none!important}
.fpill{display:inline-block!important;margin-top:4px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)!important;font-weight:700;font-size:12.5px!important;width:max-content}
.dur .fare{display:block;margin-top:3px;font-weight:700;color:var(--brand);font-size:12.5px}
.faresum{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.faresum b{display:block;font-size:16px}
.faresum span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.themeb{margin-left:auto;width:42px;height:42px;border-radius:12px;border:1px solid color-mix(in srgb,var(--hdrink) 25%,transparent);background:color-mix(in srgb,var(--hdrink) 12%,transparent);color:var(--hdrink);display:grid;place-items:center;cursor:pointer;flex:none}
.logo{width:38px;height:38px;border-radius:11px;background:#fff;color:#1f4fd8;display:grid;place-items:center;flex:none}
header h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
header small{display:block;font-size:12px;opacity:.8;font-weight:500}
.note{font-size:12px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 14px 14px 44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--brand)}
.search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;z-index:1000;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugg button{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;padding:11px 14px;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}
.sugg button:last-child{border-bottom:none}
.sugg small{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.badge{min-width:52px;max-width:72px;height:34px;padding:0 8px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12.5px;color:var(--muted)}
.star{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:4px;line-height:1}
.star.on{color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.more{text-align:center;color:var(--muted);font-size:12.5px;padding:10px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:10px;padding:4px 0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.hero .row{display:flex;align-items:center;gap:12px}
.hero h2{font-size:18px;font-weight:700;line-height:1.25}
.hero p{font-size:13px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:14px;gap:4px}
.seg button{flex:1;font:inherit;font-size:13px;font-weight:600;border:none;background:none;padding:8px;border-radius:9px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.next{display:flex;gap:8px;margin-top:12px}
.next div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.next b{display:block;font-size:20px;font-weight:800}
.next span{font-size:11.5px;color:var(--muted)}
.stops{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.stop{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative;cursor:pointer;background:none;border:none;width:100%;font:inherit;color:inherit;text-align:left}
.stop .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--c);background:var(--card);flex:none;z-index:1}
.stop:not(:last-child)::after{content:"";position:absolute;left:5.5px;top:28px;bottom:-10px;width:3px;background:var(--c)}
.stop .nm{flex:1;font-size:14.5px}
.stop .tm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini i{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;padding:2px 5px;border-radius:5px}
.dep{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dep:last-child{border-bottom:none}
.dep .t{flex:1;min-width:0}
.dep .t b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep .t span{font-size:12px;color:var(--muted)}
.dep .m{font-weight:800;font-size:18px;text-align:right;white-space:nowrap}
.dep .m small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.btn{font:inherit;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:13px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.maptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.maptools .btn{flex:1 1 100%}
.maptools .chip{flex:1}
.chip.a.on{background:#0b8a5c;border-color:#0b8a5c;color:#fff}
.chip.b.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.msg{font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
#map{height:30vh;min-height:200px;max-height:340px;border-radius:20px;border:1px solid var(--line);margin-bottom:12px;z-index:0}
.plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;cursor:pointer}
.plan.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 40%,transparent)}
.plan h3{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.plan h3 span{color:var(--muted);font-weight:500;text-align:right}
.leg{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.leg p{font-size:13.5px;line-height:1.4;min-width:0}
.leg p span{color:var(--muted)}
.walk{width:52px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-size:18px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:2000}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--brand)}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.od{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 8px 4px 14px;position:relative;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fields{flex:1;min-width:0}
.field{display:flex;align-items:center;gap:12px}
.field+.field{border-top:1px solid var(--line)}
.clr{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.field input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:16px;padding:12px 2px;color:var(--ink);outline:none}
.dotA{width:11px;height:11px;border-radius:50%;background:#0b8a5c;flex:none}
.dotB{width:11px;height:11px;border-radius:3px;background:var(--dest);flex:none}
.swapb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.od .sugg{top:100%;max-height:60vh;overflow-y:auto}
.sugg .sh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 14px 4px;background:var(--bg)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px 12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.pcard:active{transform:scale(.99)}
.pcard .main{flex:1;min-width:0}
.chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chain .w{font-size:13px;color:var(--muted);font-weight:600}
.chain .sep{color:var(--muted);font-size:13px}
.cb{display:inline-block;padding:3px 7px;border-radius:6px;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.sub{font-size:12.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:24px;font-weight:800;text-align:right;line-height:1;white-space:nowrap}
.dur small{font-size:13px;font-weight:600}
.dur span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:4px}
.chev{color:var(--muted);font-size:22px}
.chain .alt{color:var(--muted);font-size:12px;margin:0 -2px}
.dep .t .cb{color:#fff;font-size:12px}
.dep .t .chain .w{font-size:12px}
.altrow.on{background:color-mix(in srgb,var(--brand) 12%,transparent);border-radius:12px;padding-left:8px;padding-right:8px}
.dchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.dchip{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.dchip span:last-child{font-size:13px;font-weight:700;line-height:1.2}
.dchip small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.tags{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--brand) 22%,transparent);color:var(--ink)}
.dhead{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.dhead>div:first-child{flex:1;min-width:0}
.steps{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.step{display:flex;gap:12px;padding:12px 0;position:relative}
.step .ic .cb{max-width:60px;font-size:min(13px,var(--fs,13px))}
.step .ic .cb.long{font-size:9.5px;padding-left:3px;padding-right:3px;max-width:none;overflow:visible;text-overflow:clip;letter-spacing:-.2px}
.step .ic{width:52px;flex:none;display:flex;justify-content:center;position:relative;z-index:1}
.step .ic>span:not(.cb){width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:16px}
.step .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.step .tx b{font-size:14.5px}
.step .tx span,.step summary{font-size:12.5px;color:var(--muted)}
.step .wait{color:#0b8a5c!important;font-weight:600}
.step summary{cursor:pointer}
.step .ara{font-size:12px;color:var(--muted);padding:4px 0;line-height:1.5}
.step .tm{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.step.s-ride::before{content:"";position:absolute;left:24px;top:34px;bottom:8px;width:5px;border-radius:3px;background:var(--c)}
.step.s-walk::before{content:"";position:absolute;left:25px;top:40px;bottom:-4px;border-left:3px dotted var(--muted)}
#mapview.det #map{height:38vh;max-height:420px}
#dtop{margin-bottom:6px}
.mri{height:1.15em;width:1.66em;vertical-align:-.22em;display:inline-block}
.mrn{font-size:.75em;margin-left:2px;font-weight:800}
.cb.plus{background:color-mix(in srgb,var(--ink) 10%,transparent)!important;color:var(--muted)!important}
.navgo{display:block;width:100%;border:0;border-radius:14px;padding:13px;margin-bottom:10px;background:var(--brand);color:var(--brand-ink);font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
#mapview.nav #map{height:46vh;max-height:520px}
#mapview.nav #detail,#mapview.nav #dtop{display:none}
#nav{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;position:sticky;top:6px;z-index:500;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#nav .nt{display:flex;gap:10px;align-items:flex-start}
#nav .ni{font-size:26px;line-height:1;min-width:34px;text-align:center}
#nav .ni .cb{font-size:14px}
#nav b{display:block;font-size:18px;line-height:1.25}
#nav .ns{color:var(--muted);font-size:14px;margin-top:3px}
#nav .nw{margin-top:6px;font-size:14px;font-weight:600}
#nav .nw.late{color:#d62828}
#nav .nb{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#nav .nb button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 6px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
#nav .nb button.pri{background:#1f6feb;color:#fff;border-color:#1f6feb}
#nav .nx{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}
#nav .alert{background:#ffe066;color:#15171a;border-radius:10px;padding:8px 10px;margin-top:8px;font-weight:700}

<script>


// ================= UYGULAMA OLARAK YÜKLEME (PWA) =================
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));


// ================= SIFIRLAMA: × düğmeleri ve telefonun "geri" tuşu =================
function clrBtns(){ document.querySelectorAll("[data-clr]").forEach(b=>{ const inp=b.dataset.clr==="from"?fromQ:toQ; b.hidden=!inp.value; }); }
function clearEnd(w){
  if(w==="from"||w==="both"){ M.A=null; M.Aname=""; M.Aids=null; fromQ.value=""; }
  if(w==="to"||w==="both"){ M.B=null; M.Bname=""; M.Bids=null; toQ.value=""; }
  M.runId=(M.runId||0)+1; M.plans=null; M.direct=null; M.deep=null;
  if(M.sel!==null||!document.getElementById("detail").hidden) showList();
  routeLayer.clearLayers(); if(!map.hasLayer(lineLayer)) lineLayer.addTo(map);
  drawMarkers(); clrBtns(); homeBackBtn(); renderPlans(); sugg.hidden=true;
  msg(!M.A?"Nereden başlayacağını seç: konumun, bir durak ya da haritada bir nokta.":"Nereye gideceğini yaz ya da haritada bir yere dokun.");
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-clr]"); if(!b) return; e.preventDefault(); e.stopPropagation();
  clearEnd(b.dataset.clr); (b.dataset.clr==="from"?fromQ:toQ).focus(); },true);
document.addEventListener("input",e=>{ if(e.target===fromQ||e.target===toQ) clrBtns(); });
// Geri: detaydan seçeneklere, seçeneklerden ana ekrana (varış temizlenir)
window.addEventListener("popstate",()=>{
  if(state.tab!=="rota"||state.line||state.stop) return;
  if(!document.getElementById("detail").hidden){ showList(); try{map.fitBounds(L.latLngBounds([M.A,M.B]).pad(.25));}catch(e){} return; }
  if(M.plans||M.B) clearEnd("to");
});

// Sonuç ekranından ana ekrana (Son yolculuklar / Favoriler) dönüş: varış temizlenir, başlangıç kalır
function goHome(){ clearEnd("to"); if(history.state&&history.state.d) try{ history.replaceState(null,""); }catch(e){} }
function homeBackBtn(){ const b=document.getElementById("homeback"); if(b) b.hidden=!(M.A&&M.B); }
document.getElementById("homeback").onclick=()=>{ if(history.state&&history.state.d==="plans") history.back(); else goHome(); };

// ================= OTOMATİK GÜNCELLEME =================
// Ana ekrandan açılan uygulama arka planda açık kalabildiği için eski sürümde kalabiliyor.
// Uygulamaya her dönüldüğünde yeni sürüm var mı bakılır; varsa sayfa kendini yeniler.
const APP_VERSION="202611251107";
async function checkUpdate(){
  try{
    const t=await fetch("/index.html?v="+Date.now(),{cache:"no-store"}).then(r=>r.text());
    const m=t.match(/const APP_VERSION="(\d+)"/);
    if(m&&m[1]!==APP_VERSION&&!NAV){
      try{ const r=await navigator.serviceWorker.getRegistration(); r&&r.update(); }catch(e){}
      location.reload();
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
setTimeout(checkUpdate,4000);
// ================= GÜNDÜZ / GECE MODU =================
const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';

function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem("durak-tema",t); }catch(e){}
  const b=document.getElementById("themeb");
  if(b){ b.innerHTML=t==="dark"?SUN:MOON; b.setAttribute("aria-label",t==="dark"?"Gündüz moduna geç":"Gece moduna geç"); }
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==="dark"?"#0e131d":"#1f4fd8";
}
setTheme(document.documentElement.dataset.theme==="dark"?"dark":"light");
document.getElementById("themeb").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
// ================= TÜRLER VE RENKLER =================
const TYPES = {

};
const METRO_C = {M1A:"#e2231a",M1B:"#e2231a",M2:"#009b48",M2A:"#009b48",M3:"#00a3e0",M3A:"#00a3e0",M4:"#e5007d",M5:"#6f2c91",M6:"#b17f4a",M7:"#f29fc5",M8:"#1e3f95",M9:"#d4a800",T1:"#0057a8",T3:"#8b5a2b",T4:"#f28c28",F1:"#6d597a",F2:"#6d597a",F3:"#6d597a"};

// ================= YARDIMCILAR =================
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLocaleLowerCase("tr").replace(/ı/g,"i").normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmt=m=>{m=Math.round(m);m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
// Süreleri okunur yaz: 45 dk, 1 sa 20 dk
const dk=m=>{m=Math.max(0,Math.round(m)); if(m<60) return m+" dk"; const h=Math.floor(m/60), r=m%60; return h+" sa"+(r?" "+r+" dk":"");};
const dkBig=m=>{m=Math.max(0,Math.round(m)); if(m<60) return `${m}<small> dk</small>`; const h=Math.floor(m/60), r=m%60; return `${h}<small> sa</small>`+(r?` ${r}<small> dk</small>`:"");};

const badge=L=>`<div class="badge" style="background:${lc(L)}" title="${esc(nm(L))}">${bt(L)}</div>`;
const mini=L=>`<i style="background:${lc(L)}">${esc(L.b.length>6?L.b.slice(0,6):L.b)}</i>`;

// ================= VERİ =================
let LINES=[], STOPS={}, IDX={}, BYNAME={}, NAMES=[], GRID={};
const G=0.005, gk=(la,lo)=>Math.floor(la/G)+":"+Math.floor(lo/G);
// Minibüs ve dolmuş hat kodları: İBB "Minibüsüm Nerede" listesi + İBB minibüs güzergâh verisiyle eşleştirildi.
// Kodu bulunamayanlar "MB"/"DM" kalır. Sarıyer hatlarının resmi kodu "SRY".
const MBKOD={"27196":"C367","28185":"SRY","28182":"SRY","27281":"C74","7514":"SRY","7216":"A27","7217":"A16","7371":"A11","7214":"A41","7272":"A11","7271":"A11","7365":"A31","28184":"SRY","28183":"SRY","28181":"SRY","7508":"SRY","27203":"C307","27366":"ŞL15","27204":"C307","27365":"ŞL16","27363":"ŞL14","27359":"ŞL11","27358":"ŞL10","7485":"ŞL09","7279":"ŞL08","7477":"ŞL07","7275":"ŞL06","27353":"BL401","7364":"BL400","7362":"BL400","7359":"BL400","7366":"BL400","7360":"BL400","7489":"C86","27347":"C125","27208":"C311","27276":"C317","27207":"C311","27206":"C307","27205":"C307","7404":"BL101","7406":"BL101","7467":"BL101","7419":"C56","7388":"C56","7418":"C55","7384":"C55","7383":"C55","7284":"C317","7281":"C312","7250":"C118","7115":"A37","7397":"C66","7263":"A34","7139":"A43","7478":"BL110","7511":"SRY","7261":"C367","7248":"C76","7347":"C91","7336":"C89","7289":"C127","7257":"C78","7378":"C501","7479":"A71","7427":"A11","7238":"C115","7202":"A215","7507":"SRY","7164":"B33","7181":"A24","7412":"BL109","7282":"C307","7260":"C125","7376":"C354","7518":"BL110","7268":"BL200","7256":"C124","7301":"C88","7345":"ŞL01","7373":"C311","7142":"A45","7258":"C125","7439":"A01","7331":"C125","7443":"A28","7481":"ŞL04","7488":"C58","7305":"A30","7391":"C58","7175":"B37","7234":"C310","7299":"A30","7445":"A29","7387":"C56","7194":"C71","7304":"A30","7186":"A16","7442":"A28","7176":"B43","7276":"C312","7307":"A36","7322":"A24","7187":"A48","7138":"A43","7286":"C127","7370":"A08","7343":"C90","7235":"A49","7251":"C124","7152":"B46","7236":"C125","7344":"C91","7183":"A48","7108":"A03","7465":"BL145","7113":"A03","7120":"A239","7122":"A239","7144":"A46","7346":"A28","7121":"A239","7407":"BL103","7396":"C65","7295":"C84","7126":"A02","7483":"ŞL04","7459":"BL145","7313":"A32","7220":"C311","7230":"C309","7246":"C75","7348":"ŞL02","7316":"B43","7198":"A73","7358":"ŞL05","7211":"A72","7174":"C71","7239":"C311","7449":"A32","7204":"A49","7309":"A31","7394":"C64","7308":"A43","7105":"A24","7303":"A24","7209":"C74","7219":"C304","7415":"C311","7302":"A30","7229":"C109","7306":"A03","7300":"A24","7266":"A19","7403":"C70","7327":"C310","7377":"17","7341":"C89","7510":"SRY","7274":"BL202","7259":"C81","7150":"C301","7199":"A201","7213":"A41","7185":"A24","7252":"C76","7461":"BL110","7146":"A46","7136":"A43","7114":"A04","7189":"A27","7486":"A17","7240":"C116","7349":"A24","7277":"C313","7167":"B34","7210":"A72","7484":"C79","7379":"C51","7315":"A07","7287":"C127","7413":"A08","7395":"C65","7297":"C84","7171":"B35","7135":"A43","7455":"A19","7221":"C367","7110":"A03","7487":"A43","7325":"A34","7243":"C75","7441":"BL401","7389":"C65","7233":"C115","7433":"C93","7247":"C76","7241":"A27","7361":"A29","7161":"B33","7163":"B33","7116":"A38","7447":"A29","7253":"C77","7374":"C319","7334":"C125","7296":"A31","7231":"A48","7386":"BL100","7107":"A02","7342":"C125","7357":"C93","7222":"A43","7402":"C70","7380":"C52","7128":"A02","7335":"C89","7337":"C89","7369":"A29","7375":"C351","7165":"B34","7262":"A216","7197":"C72","7448":"A31","7352":"ŞL03","7196":"A71","7140":"A43","7519":"C71","7457":"A03","7201":"A213","7200":"A208","7228":"A43","7178":"A48","7255":"C77","7147":"A47","7339":"A28","7372":"A11","7294":"C83","7270":"A11","7333":"A26","7410":"BL109","7512":"SRY","7227":"C308","7265":"A36","7162":"B33","7212":"A42","7180":"B43","7400":"C70","7242":"C116","7350":"A32","7363":"BL100","7399":"C67","7226":"A43","7285":"A16","7462":"BL145","7356":"C93","7119":"A239","7440":"A03","7480":"C70","7454":"A19","7422":"A28","7367":"BL401","7291":"C127","7117":"A239","7293":"A24","7390":"C58","7191":"A27","7501":"SRY","7224":"A43","7398":"C56","7326":"A24","7245":"C117","7392":"C64","7314":"A35","7414":"BL109","7393":"C64","7298":"C87","7292":"C82","3789":"D22","3743":"D28","3790":"D46","7079":"BŞK3","3753":"D41","3786":"D44","3745":"D11","3805":"D46","3775":"D38","3776":"D41","3750":"D15","3781":"D44","3806":"D15","3755":"D31","3788":"D22","3782":"D30","3779":"D21","3741":"D41","3799":"D11","3749":"D31","3780":"D34","3738":"D44","3778":"D44","3793":"D34","3785":"D61","3744":"D38","3752":"D41","3742":"D21"};
async function loadData(){
  const D=await (await fetch("data.json")).json();
  // iett.istanbul'da sayfası artık olmayan (kaldırılmış) İETT hatları — 25.11.2026 kontrolü
  const KALDIRILAN=new Set("14 16 18 10B 10G 122M 14AK 14ÇK 16S 18A 18F 18E 18M 18Y 18V 18Ü 19ES 19FB 29P 33E 36A 36CY 36M 36TC 76B 89BS 9K ES2 ES3 PD1".split(" "));
  LINES=D.lines.filter(L=>!(L.a==="İETT"&&KALDIRILAN.has(L.b)));
  LINES.forEach(L=>{ if(L.t==="marmaray") L.b=L.b.replace(/^Marmaray/i,"MR"); if((L.t==="minibus"||L.t==="dolmus")&&MBKOD[L.id]) L.b=MBKOD[L.id]; if(L.id==="i17") L.t="minibus"; /* İETT listesindeki 17 Pendik–Kadıköy de minibüs */ });
  for(const [id,[n,la,lo]] of Object.entries(D.stops)){
    STOPS[id]={id,n,la,lo,p:[la,lo]};
    (BYNAME[n]=BYNAME[n]||[]).push(id);
    (GRID[gk(la,lo)]=GRID[gk(la,lo)]||[]).push(id);
  }
  FAST={}; LINES.forEach(L=>{ if(FASTT.has(L.t)) L.dir.forEach(x=>x.s.forEach(s=>FAST[s]=1)); });
  SI=null; setTimeout(()=>{ if(!SI) buildIndex(); },0);
  NAMES=Object.keys(BYNAME).sort((a,b)=>a.localeCompare(b,"tr"));
  // Konumu bilinmeyen durakları hatlardan çıkar
  LINES.forEach(L=>L.dir.forEach(x=>{ const keep=x.s.map((s,i)=>STOPS[s]?i:-1).filter(i=>i>=0); if(keep.length<x.s.length){ x.o=keep.map(i=>x.o[i]); x.s=keep.map(i=>x.s[i]); } }));
  LINES.forEach(L=>L.dir=L.dir.filter(x=>x.s.length>=2));
  LINES=LINES.filter(L=>L.dir.length);
  LINES.forEach((L,li)=>{ L._n=norm(L.b+" "+L.n+" "+L.a); L.dir.forEach((x,di)=>x.s.forEach((sid,pos)=>{(IDX[sid]=IDX[sid]||[]).push([li,di,pos]);})); });
}
function near(p,r){
  const out=[],cl=Math.floor(p[0]/G),co=Math.floor(p[1]/G),k=Math.ceil(r/400);
  for(let i=-k;i<=k;i++)for(let j=-k;j<=k;j++)(GRID[(cl+i)+":"+(co+j)]||[]).forEach(id=>{const d=hav(p,STOPS[id].p);if(d<=r)out.push({id,d});});
  return out.sort((a,b)=>a.d-b.d);
}
const nearCache={};
// Durağın "hızlı" bir hat (raylı, vapur, metrobüs) durağı olup olmadığı
const FASTT=new Set(["metro","marmaray","tramvay","vapur","metrobus","funikuler","teleferik","raylı"]);
let FAST={};
// Erişim durakları: yakındakilerin hepsi, uzaktakilerden sadece hızlı hat durakları
// Durak adı seçildiyse: o addaki duraklar (yürümesiz) + her birinin 500 m çevresindeki duraklar (yürüyerek)
function groupAccess(ids,R){
  const m={}; ids.forEach(id=>m[id]=0);
  ids.forEach(id=>near(STOPS[id].p,R||500).forEach(({id:j,d})=>{ if(m[j]===undefined||d<m[j]) m[j]=d; }));
  return Object.entries(m).map(([id,d])=>({id,d}));
}
// r: yavaş hat (otobüs, minibüs) durakları için yürüme sınırı, fr: hızlı hat durakları için
function access(p,r,fr){
  fr=Math.max(fr||r,r); const all=near(p,fr), out=[]; let slow=0;
  const cap=r>900?400:120;
  for(const x of all){ if(FAST[x.id]||(x.d<=r&&slow++<cap)) out.push(x); }
  return out;
}
const nearStop=(id,r)=>nearCache[id+"/"+r]||(nearCache[id+"/"+r]=near(STOPS[id].p,r));
const linesAtName=n=>{const s=new Set();(BYNAME[n]||[]).forEach(id=>(IDX[id]||[]).forEach(([li])=>s.add(li)));return [...s].map(i=>LINES[i]);};

// Bugünün kalkışları (gün maskesi: Pzt=bit0 … Paz=bit6)
let dayKey="";
function depsToday(x){
  const d=new Date(), k=d.toDateString();
  if(x._k===k) return x._t;
  const b=1<<((d.getDay()+6)%7), yb=1<<((d.getDay()+5)%7), tb=1<<(d.getDay()%7), a=new Set();
  // dün gece yarısını geçenler + bugün + yarın sabah (gece arayınca ilk sabah seferi bulunsun)
  x.d.forEach(([m,v])=>{ if(m&b) v.forEach(t=>a.add(t)); if(m&yb) v.forEach(t=>{if(t>=1440)a.add(t-1440)}); if(m&tb) v.forEach(t=>{if(t<720)a.add(t+1440)}); });
  x._t=[...a].sort((p,q)=>p-q); x._k=k; return x._t;
}
// pos durağından 'from' dakikasından sonra geçen ilk n araç
function nextAt(x,pos,from,n=1){
  const a=depsToday(x), off=x.o[pos], target=from-off; let lo=0,hi=a.length;
  while(lo<hi){const m=(lo+hi)>>1; if(a[m]<target) lo=m+1; else hi=m;}
  return a.slice(lo,lo+n).map(t=>t+off);
}

// Haritadan seçilen yere hemen en yakın durağa göre bir ad ver, sonra adres/mekân adını (OpenStreetMap) getir.
const GENERIC="Haritada seçilen nokta";
function quickName(ll){ const n=near(ll,500)[0]; return n?`${STOPS[n.id].n} yakını`:"Seçilen nokta"; }
const revCache={};
async function revName(ll){
  const k=ll.map(x=>(+x).toFixed(4)).join(",");
  if(revCache[k]) return revCache[k];
  try{
    const r=await fetch(`https://photon.komoot.io/reverse?lat=${ll[0]}&lon=${ll[1]}&limit=5&radius=0.15&lang=default`).then(r=>r.json());
    let best=null,bd=1e9;
    for(const f of (r.features||[])){ const c=f.geometry&&f.geometry.coordinates; if(!c) continue; const d=hav(ll,[c[1],c[0]]); if(d<bd){bd=d;best=f.properties;} }
    if(best&&bd<200){
      const p=best, area=p.district||p.locality||p.suburb||p.county||"";
      let n=p.name&&p.name!==p.street?p.name:(p.street?p.street+(p.housenumber?" No:"+p.housenumber:""):"");
      if(n){ if(area&&!n.includes(area)) n+=", "+area; return revCache[k]=n; }
    }
  }catch(e){}
  return revCache[k]=quickName(ll);
}
const sameLL=(a,b)=>a&&b&&Math.abs(a[0]-b[0])<1e-5&&Math.abs(a[1]-b[1])<1e-5;
async function nameLater(w,ll){
  const n=await revName(ll);
  if(w==="from"&&sameLL(M.A,ll)){ M.Aname=n; fromQ.value=n; }
  if(w==="to"&&sameLL(M.B,ll)){ M.Bname=n; toQ.value=n; }
  fixSavedNames(ll,n);
}
// Kayıtlı yolculuklardaki eski "Haritada seçilen nokta" adlarını da düzelt
function fixSavedNames(ll,n){
  let ch=false;
  [...recent,...(fav.r||[])].forEach(t=>[t.a,t.b].forEach(e=>{ if(e&&e.n!==ME&&!e.st&&sameLL(e.ll,ll)&&e.n!==n){ e.n=n; ch=true; } }));
  if(ch){ try{ localStorage.setItem("durak-son",JSON.stringify(recent)); }catch(e){} saveFav(); if(!M.plans&&!(M.A&&M.B)) renderPlans(); }
}
function fixOldNames(){
  const todo=[]; [...recent,...(fav.r||[])].forEach(t=>[t.a,t.b].forEach(e=>{ if(e&&(e.n===GENERIC||e.n==="Seçilen nokta")&&e.ll) todo.push(e.ll); }));
  todo.slice(0,8).forEach((ll,i)=>setTimeout(async()=>fixSavedNames(ll,await revName(ll)),300*i));
}

let map, lineLayer, stopLayer, vehLayer, routeLayer, mkA, mkB, myLoc=null, locAsked=false;
const M={A:null,B:null,Aname:"",Bname:"",Aids:null,Bids:null,plans:null,sel:null,field:"to"};
function initMap(){
  map=L.map("map",{zoomControl:true,preferCanvas:true}).setView([41.03,29.0],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  lineLayer=L.layerGroup().addTo(map); stopLayer=L.layerGroup(); vehLayer=L.layerGroup().addTo(map); routeLayer=L.layerGroup().addTo(map);
  // Raylı sistem ve vapur hatları (arka planda, soluk)
  LINES.forEach(Ln=>{ if(Ln.t==="minibus"||Ln.t==="dolmus"||Ln.t==="otobus") return;
    const x=Ln.dir[0], pts=x.g||x.s.map(s=>STOPS[s]?.p).filter(Boolean);
    L.polyline(pts,{color:lc(Ln),weight:Ln.t==="vapur"?1.5:3,opacity:.45,dashArray:Ln.t==="vapur"?"4 6":null,interactive:false}).addTo(lineLayer);
  });
  // Duraklar: sadece yakınlaşınca ve sadece görünen bölgedekiler (20 binden fazla durak var)
  const drawStops=()=>{
    stopLayer.clearLayers();
    if(map.getZoom()<15||M.sel!==null){ stopLayer.remove(); return; }
    const b=map.getBounds(), c=b.getCenter(), r=Math.min(2500,map.distance(c,b.getNorthEast()));
    near([c.lat,c.lng],r).slice(0,600).forEach(({id})=>{ const S=STOPS[id];
      L.circleMarker(S.p,{radius:4,color:"#333",weight:1,fillColor:"#fff",fillOpacity:1})
        .bindPopup(`<div class="pop"><b>${esc(S.n)}</b><button data-pick="to" data-sid="${S.id}">Buraya git</button><button class="g" data-pick="from" data-sid="${S.id}">Buradan başla</button><button class="g" data-pop-stop="${esc(S.n)}">Saatler</button></div>`)
        .addTo(stopLayer); });
    stopLayer.addTo(map);
  };
  map.on("moveend",()=>{ drawStops(); drawVehicles(); });
  // Haritaya dokununca: buradan mı, buraya mı?
  map.on("click",e=>{
    if(M.sel!==null) return;
    const ll=[+e.latlng.lat.toFixed(5),+e.latlng.lng.toFixed(5)];
    L.popup().setLatLng(ll).setContent(`<div class="pop"><b>Seçilen nokta</b><button data-pick="to" data-ll="${ll}">Buraya git</button><button class="g" data-pick="from" data-ll="${ll}">Buradan başla</button></div>`).openOn(map);
  });
  drawVehicles(); setInterval(drawVehicles,3000);
  renderPlans(); setTimeout(fixOldNames,1500);
  askLocation();
}
// Tarifeye göre tahmini araç konumları (görünür alandakiler)
function drawVehicles(){
  if(!map||document.getElementById("mapview").hidden) return;
  vehLayer.clearLayers();
  const now=nowMin(), b=map.getBounds().pad(.1), z=map.getZoom(), sel=M.sel!==null&&M.plans?M.plans[M.sel]:null;
  // Genel haritada araç gösterme (kalabalık); detayda sadece bineceğin araçlar
  if(!sel) return;
  if(sel){
    (sel.legs||[]).forEach(g=>{
      const Ln=LINES[g.li], x=Ln.dir[g.di], start=g.board-x.o[g.from], e=now-start;
      if(e<0||e>x.o[g.to]) return;
      let i=0; while(i<x.o.length-2&&x.o[i+1]<e) i++;
      const A=STOPS[x.s[i]], B=STOPS[x.s[i+1]]; if(!A||!B) return;
      const f=Math.min(1,Math.max(0,(e-x.o[i])/((x.o[i+1]-x.o[i])||1)));

function buildIndex(){

function rebuild(lab,k,s,arr,dmap,dests){

// Seçeneğin ölçütleri: varış, araç sayısı, toplam yürüme

  const leave=o.legs[0].board-o.w1.w-1;
  return {leave,arr:o.arr,dur:o.arr-leave,legs:o.legs.length,walk:o.w1.m+o.w2.m+o.legs.reduce((s,l)=>s+(l.tw||0),0)};

const planKey=o=>o.walk?"walk":o.legs.map(l=>l.li).join(">")+"@"+Math.round(o.legs[0].board);
// Aynı güzergâhta başka hatlar: bulunan seçeneğin her ayağında, aynı yerden (200 m) binip aynı yerde (200 m) inen

    const prev=i>0?o.legs[i-1]:null, next=last?null:o.legs[i+1];
    const prevStop=prev?sid(prev,prev.to):null, prevArr=prev?legArr(prev):0, nextStop=next?sid(next,next.from):null;
    const aC={}; nearStop(aS,200).forEach(({id,d})=>aC[id]=d);

    for(const {id:b} of nearStop(bS,200)){
      let ready, w1m=0, twm=0;
      if(i===0){ w1m=(M.Aids&&M.Aids.includes(b))?0:hav(A,P(b)); if(w1m>o.w1.m+250) continue; ready=now+walkMin(w1m); }
      else { twm=prevStop===b?0:hav(P(prevStop),P(b)); if(twm>Math.max(g.tw||0,0)+250||twm>800) continue; ready=prevArr+(twm?walkMin(twm):0)+1; }

// Seçenekleri sırala: Pareto (her açıdan daha kötüsü olmayanlar) önce, etiketli
// Sıralama: yolculuk süresine göre (evden çıkıştan varışa). Her açıdan daha kötü olanlar (süre, aktarma, yürüme) elenir.
function rank(all,now,limit){

  for(let j=0,L0=all.length;j<L0;j++){ const o=all[j]; if(o.walk||o._x||o._v) continue; if(metrics(o).dur>bd0+40) continue; o._x=1; all.push(...legVariants(o,now)); }
  const byKey={};
  // Aynı hat dizisi: en kısa süreni, eşitse en erken çıkanı tut
  all.forEach(o=>{ o.mt=metrics(o); const k=o.walk?"walk":o.legs.map(l=>l.li).join(">"); const q=byKey[k];
    if(!q||o.mt.dur<q.mt.dur-1||(Math.abs(o.mt.dur-q.mt.dur)<=1&&o.mt.leave<q.mt.leave)) byKey[k]=o;
    // aynı hat dizisinin en erken varanı da kalsın ("En erken varış" kaybolmasın)

  // Aynı hattan inip yine aynı hatta binmek anlamsız ("araçta kal"): ele. Minibüs/dolmuşta aynı kodlu farklı güzergâhlar olduğu için hariç.
  const sameHop=o=>!o.walk&&o.legs.some((l,i)=>{ if(i===0) return false; const p=o.legs[i-1];
    // önceki araç orada son durağına varıyorsa (sefer bitiyor) aynı hatta yeniden binmek gerçek bir aktarmadır
    return LINES[l.li].b===LINES[p.li].b&&LINES[l.li].t!=="minibus"&&LINES[l.li].t!=="dolmus"&&p.to<LINES[p.li].dir[p.di].s.length-1; });
  const cand=Object.values(byKey).filter(o=>!sameHop(o)&&o.mt.leave>=now-1&&o.mt.leave-now<=480&&o.mt.walk<6000)
    .sort((a,b)=>a.mt.dur-b.mt.dur||a.mt.leave-b.mt.leave||a.mt.legs-b.mt.legs||a.mt.walk-b.mt.walk);
  const kept=[], other=[];
  for(const o of cand){

  }

  tag(o=>o.mt.dur,"En kısa");
  if(kept.length>1){ tag(o=>o.mt.arr,"En erken varış"); tag(o=>o.walk?99:o.mt.legs,"En az aktarma"); tag(o=>o.mt.walk,"En az yürüme"); }

    const best=Math.min(...cand.map(o=>o.mt.dur)), seenK=new Set(top.filter(o=>!o.walk).map(o=>o.legs.map(l=>LINES[l.li].b).join(">")));

const sameRoute=(a,b)=>{

    return hav(STOPS[x.s[g.from]].p,STOPS[y.s[h.from]].p)<250&&hav(STOPS[x.s[g.to]].p,STOPS[y.s[h.to]].p)<250; });

function groupPlans(list){
  const groups=[];
  for(const o of list){
    const g=groups.find(g=>sameRoute(g,o)&&o.mt.dur<=g.mt.dur+40);
    // aynı hat(lar) aynı saatte (sadece varyant farkı) tekrar eklenmesin
    const sig=p=>p.legs.map(l=>LINES[l.li].b+"@"+fmt(l.board)).join(">");

// Hızlı arama: birkaç yürüme sınırı + ana hat yasaklı tekrar

  if(mode==="orta") return ids?groupAccess(ids,500):access(P,600,1500);  // otobüse 600 m, raylıya 1,5 km

// Rota araması aşamalara bölünür: ilk aşama hemen gösterilir, diğerleri arka planda eklenir

  const cache={}; const get=(side,mode)=>cache[side+mode]||(cache[side+mode]=side==="A"?acc(A,Aids,mode):acc(B,Bids,mode));

    const res=raptor(O,Dn,now); all.push(...res);

    // feeder: sadece ilk binilen hattı yok say -> aynı ana hatta (örn. Marmaray) farklı yaklaşma yolları (17, minibüs…)
    const ban=new Set(); let cur=res;

      if(feeder){ if(best.legs.length<2) break; ban.add(best.legs[0].li); } else best.legs.forEach(l=>ban.add(l.li));
      cur=raptor(O,Dn,now,new Set(ban)); all.push(...cur); } };

    // "az yürü" modları ara seçenekleri bulur (raylıya 1 km yürümek yerine otobüs/minibüsle yaklaşıp aynı trene binmek)
    ()=>run("az","orta",1), ()=>run("orta","az",1), ()=>run("az","az",1),
    ()=>run("az","orta",3,true), ()=>run("orta","az",2,true),
    ()=>run("orta","orta",3), ()=>run("genis","genis",1),
    // Sonuç yoksa ya da çok uzun sürüyorsa (gece, seyrek hatlar): 1,5 km'ye kadar her durağa yürüyerek geniş ara
    ()=>{ const bestNow=Math.min(...all.filter(o=>!o.walk).map(o=>o.arr),1e9);
      if(bestNow>now+60) all.push(...raptor(get("A","gece"),get("B","gece"),now,null,{hor:300,full:true})); },
    // Gece ya da şu an makul sefer yoksa: sonraki çıkışlar ve sabah ilk seferleri (05:00–06:30), az/orta yürüme modlarıyla
    ()=>{ const hh=now%1440, soon=all.some(o=>!o.walk&&o.legs[0].board-now<=60), starts=[];
      if(hh<300||!soon){ starts.push(now+30,now+60,now+120); if(hh<300) [300,330,360,390].forEach(t=>starts.push(now-hh+t)); else if(hh>=1200) [300,330,360,390].forEach(t=>starts.push(now-hh+1440+t)); }
      for(const t0 of starts) for(const [ma,mb] of [["orta","orta"],["az","orta"],["orta","az"]]){
        const O=get("A",ma), Dn=get("B",mb); if(!O.length||!Dn.length) continue;
        let cur=raptor(O,Dn,t0,null,{hor:120}).filter(o=>o.legs[0].board>=t0); all.push(...cur);
        // farklı besleyici hatlar (aynı ana trene başka otobüs/minibüsle yaklaşma)
        if(ma==="az"){ const ban=new Set(); for(let i=0;i<3&&cur.length;i++){ const b=cur.reduce((x,c)=>c.arr<x.arr?c:x); if(b.legs.length<2) break; ban.add(b.legs[0].li);

// Geniş arama: 2,5 km yürüme, 800 m aktarma, 6 araç, bulunan her hattı yasaklayıp tekrar, sonraki kalkışlar
async function deepPlan(){

  const yieldUI=()=>new Promise(r=>setTimeout(r,0));
  const radii=(M.Aids&&M.Bids)?[[0,0]]:[[400,400],[400,2500],[2500,400],[900,2500],[2500,900]];
  let n=0; const total=radii.length*10+4;
  const step=async()=>{ n++; if(n%3===0){ M.deepMsg=`Geniş arama… %${Math.min(99,Math.round(n/total*100))} · ${new Set(all.map(planKey)).size} seçenek`; renderPlans(); await yieldUI(); if(M.runId!==run) throw 0; } };

    for(const [ra,rb] of radii){
      const O=M.Aids?groupAccess(M.Aids):access(M.A,Math.min(ra,800),ra), Dn=M.Bids?groupAccess(M.Bids):access(M.B,Math.min(rb,800),rb);

      for(const li of lines){ all.push(...raptor(O,Dn,now,new Set([li]),opt)); await step(); }

    }

}

// Hattın gerçek güzergâhından iki durak arasını kes (yoksa duraklar arası düz çizgi)
function legPath(x,from,to){
  const pts=x.s.slice(from,to+1).map(s=>STOPS[s].p);
  if(!x.g||x.g.length<2) return pts;
  const ni=p=>{let bi=0,bd=1e18;x.g.forEach((q,i)=>{const d=(q[0]-p[0])**2+(q[1]-p[1])**2;if(d<bd){bd=d;bi=i;}});return bi;};

// İETT/ÖHO otobüs, metro, tramvay, füniküler, teleferik: ilk biniş 46,20; 2 saat içindeki aktarmalar 34,40 / 26,42 / 17,18…
// Mesafeye göre değişenlerde her zaman en yüksek ücret: metrobüs 68,59 (metrobüse geçişte indirim yok), Marmaray 82,17.
// Minibüs: UKOME mesafe tarifesi (0–4 km 43, 4–7 45, 7–11 46, 11–15 47, 15+ 52 TL), hattın tamamının uzunluğuna göre (en yüksek). Dolmuş: hat ücreti tablosu (UKOME).
// Vapur: Şehir Hatları'nın bilinen en yüksek tam ücreti 59,28. Kesin olmayanlar "≈" ile gösterilir.
// İETT otobüslerinde 00:30–05:30 arası gece seferleri çift bilettir (iett.istanbul hat sayfası notu).
const FARE={tam:46.20, akt:[34.40,26.42,17.18,17.18,17.18], metrobus:68.59, marmaray:82.17, vapur:59.28};
const DM_FARE={BŞK1:55,BŞK2:55,BŞK3:65,BŞK5:65,D11:95,D15:110,D41:70,D44:65,D46:55,D21:55,D22:65,D25:55,D28:145,D30:55,D58:55,D31:130,D34:70,D38:65,D61:145};

function minibusFare(L){

function fareOf(o){

  for(const g of o.legs){

// ================= CANLI YOL TARİFİ =================
// Seçilen güzergâhı adım adım takip eder: yürü → bekle → bin (kalan durak) → in → … → varış.
// Konum varsa adımlar kendiliğinden ilerler; yer altında (metro, Marmaray) konum yoksa tarifeye göre tahmin edilir; elle de ilerletilebilir.
let NAV=null;
function navPhases(o){
  const ss=steps(o), ph=[];
  ss.forEach((s,i)=>{
    if(s.k==="walk"){ const last=i===ss.length-1;
      if(last) ph.push({k:"walk",from:s.from,to:s.to,txt:"Varış noktasına yürü",last:true});
      else if(s.m>25) ph.push({k:"walk",from:s.from,to:s.to,txt:s.txt});
      return; }
    const pts=s.x.s.slice(s.g.from,s.g.to+1).map(id=>({id,n:STOPS[id].n,p:STOPS[id].p,o:s.x.o[s.g.from+0]}));
    pts.forEach((q,j)=>q.o=s.x.o[s.g.from+j]-s.x.o[s.g.from]);
    ph.push({k:"wait",s,pts},{k:"ride",s,pts});
  });
  ph.push({k:"done"});
  return ph;
}

function navNext(d){ const n=NAV.i+d; if(n<0||n>=NAV.ph.length) return; NAV.i=n; navEnter(); navTick(); }

// tarif seçtiğin başlangıçtan yürür, adımları elle ilerletirsin. Rotaya yaklaşınca (500 m) GPS devreye girer.
function navOnRoute(){
  if(NAV.onRoute) return true;
  if(!NAV.pos) return false;
  if(M.Aname==="📍 Konumum") return NAV.onRoute=true;
  const pts=[M.A,M.B]; NAV.ph.forEach(q=>{ if(q.k==="walk"){ if(q.from) pts.push(q.from); pts.push(q.to); } else if(q.pts) q.pts.forEach(z=>pts.push(z.p)); });
  if(pts.some(q=>q&&hav(NAV.pos,q)<500)){ NAV.onRoute=true; say("Konumun bulundu, takip başladı"); }

}
const gpsOk=()=>NAV.pos&&Date.now()-NAV.fix<45000&&(NAV.acc||0)<150&&navOnRoute();
function navTick(){
  if(!NAV) return;
  const P=NAV.ph[NAV.i], now=nowMin(), pos=NAV.pos;

  if(pos&&!navOnRoute()&&NAV.mk){ NAV.mk.remove(); NAV.ac.remove(); NAV.mk=null; }
  if(pos&&navOnRoute()){ if(!NAV.mk){ NAV.ac=L.circle(pos,{radius:NAV.acc||30,color:"#1f6feb",weight:1,fillOpacity:.12,interactive:false}).addTo(map);
      NAV.mk=L.circleMarker(pos,{radius:8,color:"#fff",weight:3,fillColor:"#1f6feb",fillOpacity:1,interactive:false}).addTo(map); }
    else { NAV.mk.setLatLng(pos); NAV.ac.setLatLng(pos).setRadius(NAV.acc||30); } }
  // kendiliğinden ilerleme
  if(gpsOk()){
    if(P.k==="walk"&&hav(pos,P.to)<(P.last?40:35)) return navNext(1);
    if(P.k==="wait"){ const d0=hav(pos,P.pts[0].p);
      // durak listesinde ilerledik mi (araca binmiş olmalı)
      let bi=-1,bd=1e9; P.pts.forEach((q,j)=>{const d=hav(pos,q.p); if(d<bd){bd=d;bi=j;}});
      if(bi>=1&&((d0>180&&bd<250)||(d0>100&&bd<50))) return navNext(1); }
    if(P.k==="ride"){ let bi=NAV.ci,bd=1e9; for(let j=NAV.ci;j<P.pts.length;j++){const d=hav(pos,P.pts[j].p); if(d<bd){bd=d;bi=j;}}

      if(NAV.ci>=P.pts.length-1&&hav(pos,P.pts[P.pts.length-1].p)<80) return navNext(1); }
  }
  if(P.k==="ride"&&!gpsOk()&&NAV.boardAt!=null){ // konum yok (yer altı): tarifeye göre tahmin
    const el=now-NAV.boardAt; let j=0; while(j+1<P.pts.length&&P.pts[j+1].o<=el) j++; NAV.ci=Math.max(NAV.ci,Math.min(j,P.pts.length-2)); }

    if(rem<=1&&!NAV.said.r1){ NAV.said.r1=1; buzz(); say(`Sonraki durakta in: ${P.s.off}`); }
    else if(rem===2&&!NAV.said.r2&&P.pts.length>3){ NAV.said.r2=1; say(`İki durak sonra ineceksin`); } }

  navRender();
}
// Tahmini konum: GPS varsa o, yoksa bulunulan adımın yeri
function navWhere(){
  const P=NAV.ph[NAV.i];

  if(P.k==="walk") return P.from||NAV.pos||P.to;

}
// Harita her adımda o adımın yerini gösterir: yürürken sen + hedef durak, beklerken durak, araçta bulunduğun yer + ineceğin durak

// Nereden / Nereye arama kutuları
const fromQ=document.getElementById("fromQ"), toQ=document.getElementById("toQ"), sugg=document.getElementById("sugg");
// Adres ve yer arama (Photon / OpenStreetMap), yazmayı bitirince sorulur
let placeTimer=null, placeSeq=0; const placeCache={};
const placeLabel=f=>{const p=f.properties;
  const name=p.name||[p.street,p.housenumber].filter(Boolean).join(" ");
  const sub=[p.name&&p.street?[p.street,p.housenumber].filter(Boolean).join(" "):"",p.district||p.locality,p.county||p.city].filter((x,i,a)=>x&&a.indexOf(x)===i&&x!==name).slice(0,2).join(", ");
  return {name,sub,ll:[+f.geometry.coordinates[1].toFixed(5),+f.geometry.coordinates[0].toFixed(5)]};};
async function fetchPlaces(q){
  if(placeCache[q]) return placeCache[q];
  const u="https://photon.komoot.io/api/?q="+encodeURIComponent(q)+"&limit=6&lat=41.02&lon=29.0&bbox=27.9,40.8,29.95,41.6";
  const j=await (await fetch(u)).json(); const seen=new Set();
  return placeCache[q]=j.features.map(placeLabel).filter(x=>x.name&&!seen.has(x.name+x.sub)&&seen.add(x.name+x.sub)).slice(0,5);

// Harita linki ya da koordinattan konum çıkar (Google, Yandex, Apple, "41.01, 28.97")
function coordFrom(text){
  const t=decodeURIComponent(text||""); let m;
  const ok1=(la,lo)=>la>40.5&&la<41.7&&lo>27.5&&lo<30?[+(+la).toFixed(5),+(+lo).toFixed(5)]:null;
  const ok=(a,b)=>ok1(a,b)||ok1(b,a); // Yandex boylam,enlem sırası kullanır
  if((m=t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))) return ok(m[1],m[2]);          // Google yer işareti
  if((m=t.match(/[?&](?:q|ll|daddr|query)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/))) return ok(m[1],m[2]); // Google/Apple ?q=
  if((m=t.match(/[?&](?:ll|pt|whatshere%5Bpoint%5D|whatshere\[point\])=(-?\d+\.\d+),(-?\d+\.\d+)/))) return ok(m[2],m[1]); // Yandex (boylam,enlem)
  if((m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))) return ok(m[1],m[2]);               // Google @enlem,boylam
  if((m=t.match(/^\s*(-?\d{2}\.\d+)\s*[, ]\s*(-?\d{2}\.\d+)\s*$/))) return ok(m[1],m[2]); // düz koordinat
  return null;
}
const placeName=text=>{ const m=decodeURIComponent(text).match(/\/place\/([^/@]+)/); return m?m[1].replace(/\+/g," "):"Linkteki konum"; };
async function fromLink(w,raw){

    msg("Link açılıyor…");

  }
  if(!ll) return msg("Bu linkte konum bulunamadı. Haritada dokunarak seçebilirsin.");
  setEnd(w,ll,name);
}
function showSugg(which){
  M.field=which; const inp=which==="from"?fromQ:toQ, raw=inp.value.trim().replace("📍 ",""), q=norm(raw);
  const score=n=>{const x=norm(n);return x===q?0:x.startsWith(q)?1:2;};
  // Aynı adın büyük/küçük harf farklı kayıtlarını tek göster (seçince hepsi birlikte kullanılır)
  const seenN=new Set();
  const r=q.length>=2?NAMES.filter(n=>norm(n).includes(q)).sort((a,b)=>score(a)-score(b)||a.length-b.length||(a===a.toLocaleUpperCase("tr"))-(b===b.toLocaleUpperCase("tr")))
    .filter(n=>{const k=norm(n);if(seenN.has(k))return false;seenN.add(k);return true;}).slice(0,5):[];
  sugg.style.top=(inp.offsetTop+inp.offsetHeight+6)+"px";
  const isLink=/^https?:\/\//.test(raw)||coordFrom(raw);
  if(isLink){ sugg.style.top=(inp.offsetTop+inp.offsetHeight+6)+"px"; sugg.innerHTML=`<button data-sug-link>🔗 Linkteki/koordinattaki konumu kullan</button>`; sugg.hidden=false; return; }
  sugg.innerHTML=`<button data-sug-loc>📍 Konumum</button><button data-sug-map>🗺️ Haritada seç</button>`+
    (r.length?`<div class="sh">Duraklar</div>`:"")+
    r.map(n=>`<button data-sug="${esc(n)}">🚏 ${esc(n)} <small>${[...new Set(group(n).flatMap(id=>(IDX[id]||[]).map(([li])=>LINES[li].b)))].slice(0,5).map(esc).join(", ")}</small></button>`).join("")+
    (raw.length>=3?`<div class="sh">Yerler ve adresler</div><div id="places"><button disabled><small>Aranıyor…</small></button></div>`:"");
  sugg.hidden=false;
  clearTimeout(placeTimer);
  if(raw.length>=3&&raw!=="Konumum"){
    const seq=++placeSeq;
    placeTimer=setTimeout(async()=>{
      try{
        const ps=await fetchPlaces(raw); if(seq!==placeSeq) return;
        const el=document.getElementById("places"); if(!el) return;
        el.innerHTML=ps.map(x=>`<button data-place="${x.ll}" data-pname="${esc(x.name)}">📌 ${esc(x.name)} <small>${esc(x.sub)}</small></button>`).join("")||`<button disabled><small>Adres bulunamadı</small></button>`;
      }catch(e){ const el=document.getElementById("places"); if(el) el.innerHTML=`<button disabled><small>Adres araması şu an çalışmıyor</small></button>`; }
    },400);
  }
}
[["from",fromQ],["to",toQ]].forEach(([w,inp])=>{
  inp.addEventListener("focus",()=>{ inp.select(); showSugg(w); });
  inp.addEventListener("input",()=>showSugg(w));
  inp.addEventListener("paste",()=>setTimeout(()=>{ const v=inp.value.trim(); if(/^https?:\/\//.test(v)||coordFrom(v)){ sugg.hidden=true; inp.blur(); fromLink(w,v); } },0));
});
document.addEventListener("click",e=>{ if(!e.target.closest(".od")) sugg.hidden=true; });
sugg.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const w=M.field;
  if(b.hasAttribute("data-sug-loc")){ sugg.hidden=true; if(myLoc) return setEnd(w,myLoc,"📍 Konumum"); return askLocation(()=>{ if(w==="to") setEnd("to",myLoc,"📍 Konumum"); }); }
  if(b.hasAttribute("data-sug-link")){ sugg.hidden=true; const inp=w==="from"?fromQ:toQ; inp.blur(); return fromLink(w,inp.value.trim()); }
  if(b.hasAttribute("data-sug-map")){ sugg.hidden=true; (w==="from"?fromQ:toQ).blur(); return msg(w==="from"?"Başlangıç için haritada bir yere dokun.":"Gideceğin yer için haritada bir yere dokun."); }
  if(b.dataset.sug){ const n=b.dataset.sug; setEnd(w,STOPS[BYNAME[n][0]].p,n,group(n)); }
  if(b.dataset.place){ setEnd(w,b.dataset.place.split(",").map(Number),b.dataset.pname); }
});
document.getElementById("swap").onclick=()=>{
  [M.A,M.B,M.Aname,M.Bname,M.Aids,M.Bids]=[M.B,M.A,M.Bname,M.Aname,M.Bids,M.Aids]; setEnd("from",M.A,M.Aname,M.Aids);
};
// Aynı addaki duraklar (ilk durağa 2,5 km'den yakın olanlar)
const group=n=>{const f=STOPS[BYNAME[n][0]], k=norm(n);
  return NAMES.filter(x=>norm(x)===k).flatMap(x=>BYNAME[x]).filter(id=>hav(f.p,STOPS[id].p)<2500);};
function gotoStopName(n){ setEnd("to",STOPS[BYNAME[n][0]].p,n,group(n)); }

// ================= ÇİZİM =================
const app=document.getElementById("app"), mv=document.getElementById("mapview");
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
  const showMap=state.tab==="rota"&&!state.line&&!state.stop;
  mv.hidden=!showMap; app.hidden=showMap;
  if(showMap){ if(!map) initMap(); setTimeout(()=>{map.invalidateSize();drawVehicles();},0); return; }
  app.innerHTML=state.line?viewLine():state.stop?viewStop():{hatlar:viewLines,duraklar:viewStops,favoriler:viewFav}[state.tab]();
  const q=document.getElementById("q");
  if(q) q.oninput=e=>{state.q=e.target.value;const p=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p);};
}
function openLine(id,d){ hist.push({line:state.line,stop:state.stop,dir:state.dir,tab:state.tab}); go({line:id,stop:null,dir:+(d||0)}); }
function openStop(n){ hist.push({line:state.line,stop:state.stop,dir:state.dir,tab:state.tab}); go({stop:n,line:null}); }
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-alt],[data-direct],[data-deep],[data-pick],[data-open],[data-dback],[data-fh],[data-fd],[data-f],[data-dir],[data-back],[data-line],[data-stop],[data-goto],[data-pop-stop]"); if(!el) return;
  const ds=el.dataset;
  if(ds.pick){ const ll=ds.sid?STOPS[ds.sid].p:ds.ll.split(",").map(Number); if(ds.sid) return setEnd(ds.pick,ll,STOPS[ds.sid].n);
    setEnd(ds.pick,ll,quickName(ll)); return nameLater(ds.pick,ll); }
  if(ds.alt){ const [k,j]=ds.alt.split(":").map(Number); if(j===0) return; const g=M.plans[k], all=[g,...g.alts], c=all[j];
    c.alts=all.filter(x=>x!==c); c.tags=g.tags; g.alts=[]; M.plans[k]=c; return openPlan(k); }
  if(ds.direct!==undefined){ const o=M.direct[+ds.direct]; M.plans.push(o); return openPlan(M.plans.length-1); }
  if(el.hasAttribute("data-deep")){ M.deep="run"; renderPlans(); return setTimeout(deepPlan,30); }
  if(ds.open!==undefined) return openPlan(+ds.open);
  if(el.hasAttribute("data-dback")){ if(history.state&&history.state.d==="det") return history.back(); showList(); try{map.fitBounds(L.latLngBounds([M.A,M.B]).pad(.25));}catch(e){} return; }
  if(ds.popStop){ map.closePopup(); return openStop(ds.popStop); }
  if(ds.fh){ e.stopPropagation(); return toggleFav("h",ds.fh); }
  if(ds.fd!==undefined){ e.stopPropagation(); return toggleFav("d",ds.fd); }
  if(ds.f) return go({filtre:ds.f});
  if(ds.dir!==undefined) return go({dir:+ds.dir});
  if(ds.goto){ hist=[]; go({tab:"rota",line:null,stop:null}); return gotoStopName(ds.goto); }
  if(el.hasAttribute("data-back")) return go(hist.pop()||{line:null,stop:null});
  if(ds.line) return openLine(ds.line,ds.d);
  if(ds.stop!==undefined) return openStop(ds.stop);
});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  // Zaten "Nasıl Giderim"deyken tekrar basınca: rota sonuçlarından ana ekrana dön
  if(b.dataset.tab==="rota"&&state.tab==="rota"&&!state.line&&!state.stop&&(M.plans||M.B||NAV)){ if(NAV) stopNav(); goHome(); window.scrollTo(0,0); return; }
  hist=[];go({tab:b.dataset.tab,line:null,stop:null,q:""});});
setInterval(()=>{ if(!app.hidden&&(!document.activeElement||document.activeElement.tagName!=="INPUT")) render(); },30000);

loadData().then(render).catch(e=>{app.innerHTML=`<div class="empty">Veri yüklenemedi: ${esc(e.message)}</div>`;});
</script>
</body>
