<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Durak – İstanbul Toplu Taşıma</title>
<meta name="description" content="Reklamsız İstanbul toplu taşıma: metro, Marmaray, tramvay, vapur, minibüs ve dolmuş hatları, sefer saatleri ve nasıl giderim.">
<meta name="theme-color" content="#f2b300">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#15171a; --muted:#6b7078; --line:#e6e3dc;
  --brand:#f2b300; --brand-ink:#1a1400; --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1113; --card:#181b1f; --ink:#eef0f2; --muted:#9aa1a9; --line:#262a30; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
header h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
header small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.note{font-size:12px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 14px 14px 44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--brand)}
.search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;z-index:1000;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugg button{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;padding:11px 14px;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}
.sugg button:last-child{border-bottom:none}
.sugg small{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.badge{min-width:52px;max-width:72px;height:34px;padding:0 8px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12.5px;color:var(--muted)}
.star{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:4px;line-height:1}
.star.on{color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.more{text-align:center;color:var(--muted);font-size:12.5px;padding:10px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:10px;padding:4px 0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.hero .row{display:flex;align-items:center;gap:12px}
.hero h2{font-size:18px;font-weight:700;line-height:1.25}
.hero p{font-size:13px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:14px;gap:4px}
.seg button{flex:1;font:inherit;font-size:13px;font-weight:600;border:none;background:none;padding:8px;border-radius:9px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.next{display:flex;gap:8px;margin-top:12px}
.next div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.next b{display:block;font-size:20px;font-weight:800}
.next span{font-size:11.5px;color:var(--muted)}
.stops{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.stop{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative;cursor:pointer;background:none;border:none;width:100%;font:inherit;color:inherit;text-align:left}
.stop .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--c);background:var(--card);flex:none;z-index:1}
.stop:not(:last-child)::after{content:"";position:absolute;left:5.5px;top:28px;bottom:-10px;width:3px;background:var(--c)}
.stop .nm{flex:1;font-size:14.5px}
.stop .tm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini i{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;padding:2px 5px;border-radius:5px}
.dep{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dep:last-child{border-bottom:none}
.dep .t{flex:1;min-width:0}
.dep .t b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep .t span{font-size:12px;color:var(--muted)}
.dep .m{font-weight:800;font-size:18px;text-align:right;white-space:nowrap}
.dep .m small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.btn{font:inherit;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:13px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.maptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.maptools .btn{flex:1 1 100%}
.maptools .chip{flex:1}
.chip.a.on{background:#0b8a5c;border-color:#0b8a5c;color:#fff}
.chip.b.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.msg{font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
#map{height:56vh;min-height:320px;border-radius:20px;border:1px solid var(--line);margin-bottom:12px;z-index:0}
.plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;cursor:pointer}
.plan.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 40%,transparent)}
.plan h3{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.plan h3 span{color:var(--muted);font-weight:500;text-align:right}
.leg{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.leg p{font-size:13.5px;line-height:1.4;min-width:0}
.leg p span{color:var(--muted)}
.walk{width:52px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-size:18px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:2000}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--brand)}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.leaflet-popup-content{font-family:Inter,system-ui,sans-serif;font-size:13px}
.pop b{display:block;margin-bottom:6px}
.pop button{font:inherit;font-size:12.5px;font-weight:700;border:none;border-radius:8px;padding:6px 10px;margin:2px 4px 0 0;cursor:pointer;background:#f2b300;color:#1a1400}
.pop button.g{background:#eee;color:#222}
.loading{padding:60px 10px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="12" rx="3" fill="#1a1400"/><rect x="7" y="6" width="10" height="4" rx="1" fill="#f2b300"/><circle cx="8" cy="12.5" r="1" fill="#f2b300"/><circle cx="16" cy="12.5" r="1" fill="#f2b300"/><rect x="11" y="15" width="2" height="7" rx="1" fill="#1a1400"/></svg></div>
    <div><h1>Durak</h1><small>İstanbul toplu taşıma · reklamsız</small></div>
  </header>
  <div class="note">Veri: İBB Açık Veri (metro, Marmaray, tramvay, vapur, minibüs, dolmuş). Saatler tarifeye göredir, araç konumları tahminidir. İETT otobüs ve metrobüs yakında.</div>
  <main id="app"><div class="loading">Hatlar yükleniyor…</div></main>
  <section id="mapview" hidden>
    <div class="search" id="dsearch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="dq" placeholder="Nereye? Durak ara: Kadıköy, Taksim…" autocomplete="off"><div class="sugg" id="dsugg" hidden></div></div>
    <div class="maptools">
      <button class="btn" data-act="loc">📍 Konumumu kullan</button>
      <button class="chip a" data-act="A">A · Başlangıç</button>
      <button class="chip b on" data-act="B">B · Varış</button>
      <button class="chip" data-act="clear">Temizle</button>
    </div>
    <div class="msg" id="msg">Önce "Konumumu kullan"a bas, sonra gideceğin yeri ara ya da haritada dokun.</div>
    <div id="map"></div>
    <div id="plans"></div>
  </section>
</div>
<nav><div class="in">
  <button data-tab="rota"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h7.5"/></svg>Nasıl Giderim</button>
  <button data-tab="hatlar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21l1-4M16 21l-1-4"/></svg>Hatlar</button>
  <button data-tab="duraklar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Duraklar</button>
  <button data-tab="favoriler"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>Favoriler</button>
</div></nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ================= TÜRLER VE RENKLER =================
const TYPES = {
  metro:{ad:"Metro",c:"#d62828"}, marmaray:{ad:"Marmaray",c:"#e07a00"}, tramvay:{ad:"Tramvay",c:"#0b8a5c"},
  vapur:{ad:"Vapur",c:"#0077b6"}, minibus:{ad:"Minibüs",c:"#2a9d8f"}, dolmus:{ad:"Dolmuş",c:"#8d5524"},
  funikuler:{ad:"Füniküler",c:"#6d597a"}, teleferik:{ad:"Teleferik",c:"#457b9d"}, otobus:{ad:"Otobüs",c:"#1f6feb"}, "raylı":{ad:"Raylı",c:"#e07a00"}
};
const METRO_C = {M1A:"#e2231a",M1B:"#e2231a",M2:"#009b48",M2A:"#009b48",M3:"#00a3e0",M3A:"#00a3e0",M4:"#e5007d",M5:"#6f2c91",M6:"#b17f4a",M7:"#f29fc5",M8:"#1e3f95",M9:"#d4a800",T1:"#0057a8",T3:"#8b5a2b",T4:"#f28c28",F1:"#6d597a",F2:"#6d597a",F3:"#6d597a"};
const lc = L => METRO_C[L.b] || (TYPES[L.t]||TYPES.otobus).c;
const tad = L => (TYPES[L.t]||TYPES.otobus).ad;
const FILTERS = ["hepsi","metro","marmaray","tramvay","vapur","minibus","dolmus","funikuler","teleferik"];

// ================= YARDIMCILAR =================
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLocaleLowerCase("tr").replace(/ı/g,"i").normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmt=m=>{m=Math.round(m);m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const inMin=t=>{const x=Math.round(t-nowMin());return x<=0?"Şimdi":x+" dk"};
const hav=(a,b)=>{const r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const s=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 2*6371000*Math.asin(Math.sqrt(s));};
const walkMin=m=>Math.max(1,Math.round(m*1.3/80));
const badge=L=>`<div class="badge" style="background:${lc(L)}" title="${esc(L.b)}">${esc(L.b)}</div>`;
const mini=L=>`<i style="background:${lc(L)}">${esc(L.b.length>6?L.b.slice(0,6):L.b)}</i>`;

// ================= VERİ =================
let LINES=[], STOPS={}, IDX={}, BYNAME={}, NAMES=[], GRID={};
const G=0.005, gk=(la,lo)=>Math.floor(la/G)+":"+Math.floor(lo/G);
async function loadData(){
  const D=await (await fetch("data.json")).json();
  LINES=D.lines;
  LINES.forEach(L=>{ if(L.t==="marmaray") L.b=L.b.replace(/^Marmaray/i,"MR"); });
  for(const [id,[n,la,lo]] of Object.entries(D.stops)){
    STOPS[id]={id,n,la,lo,p:[la,lo]};
    (BYNAME[n]=BYNAME[n]||[]).push(id);
    (GRID[gk(la,lo)]=GRID[gk(la,lo)]||[]).push(id);
  }
  NAMES=Object.keys(BYNAME).sort((a,b)=>a.localeCompare(b,"tr"));
  LINES.forEach((L,li)=>{ L._n=norm(L.b+" "+L.n+" "+L.a); L.dir.forEach((x,di)=>x.s.forEach((sid,pos)=>{(IDX[sid]=IDX[sid]||[]).push([li,di,pos]);})); });
}
function near(p,r){
  const out=[],cl=Math.floor(p[0]/G),co=Math.floor(p[1]/G),k=Math.ceil(r/400);
  for(let i=-k;i<=k;i++)for(let j=-k;j<=k;j++)(GRID[(cl+i)+":"+(co+j)]||[]).forEach(id=>{const d=hav(p,STOPS[id].p);if(d<=r)out.push({id,d});});
  return out.sort((a,b)=>a.d-b.d);
}
const nearCache={};
const nearStop=(id,r)=>nearCache[id+"/"+r]||(nearCache[id+"/"+r]=near(STOPS[id].p,r));
const linesAtName=n=>{const s=new Set();(BYNAME[n]||[]).forEach(id=>(IDX[id]||[]).forEach(([li])=>s.add(li)));return [...s].map(i=>LINES[i]);};

// Bugünün kalkışları (gün maskesi: Pzt=bit0 … Paz=bit6)
let dayKey="";
function depsToday(x){
  const d=new Date(), k=d.toDateString();
  if(x._k===k) return x._t;
  const b=1<<((d.getDay()+6)%7), yb=1<<((d.getDay()+5)%7), a=new Set();
  x.d.forEach(([m,v])=>{ if(m&b) v.forEach(t=>a.add(t)); if(m&yb) v.forEach(t=>{if(t>=1440)a.add(t-1440)}); });
  x._t=[...a].sort((p,q)=>p-q); x._k=k; return x._t;
}
// pos durağından 'from' dakikasından sonra geçen ilk n araç
function nextAt(x,pos,from,n=1){
  const a=depsToday(x), off=x.o[pos], target=from-off; let lo=0,hi=a.length;
  while(lo<hi){const m=(lo+hi)>>1; if(a[m]<target) lo=m+1; else hi=m;}
  return a.slice(lo,lo+n).map(t=>t+off);
}

// ================= FAVORİLER =================
let fav={h:[],d:[]};
try{ fav=JSON.parse(localStorage.getItem("durak-fav2"))||fav; }catch(e){}
const isFav=(k,id)=>fav[k].includes(id);
function toggleFav(k,id){ fav[k]=isFav(k,id)?fav[k].filter(x=>x!==id):[...fav[k],id]; try{localStorage.setItem("durak-fav2",JSON.stringify(fav));}catch(e){} render(); }

// ================= DURUM =================
let state={tab:"rota",q:"",filtre:"hepsi",line:null,dir:0,stop:null};
let hist=[];
function go(p){ state={...state,...p}; render(); window.scrollTo(0,0); }

// ================= EKRANLAR =================
function viewLines(){
  const q=norm(state.q);
  const ls=LINES.filter(L=>(state.filtre==="hepsi"||L.t===state.filtre)&&(!q||L._n.includes(q)));
  const chips=FILTERS.map(k=>`<button class="chip ${state.filtre===k?"on":""}" data-f="${k}">${k==="hepsi"?"Hepsi":TYPES[k].ad}</button>`).join("");
  return `<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
  <input id="q" placeholder="Hat ara: M2, Marmaray, Kadıköy…" value="${esc(state.q)}" autocomplete="off"></div>
  <div class="chips">${chips}</div>
  <div class="list">${ls.slice(0,60).map(L=>`
    <div class="item" data-line="${L.id}">${badge(L)}
      <div class="t"><b>${esc(L.n)}</b><span>${tad(L)} · ${L.dir[0].s.length} durak${L.a?" · "+esc(L.a):""}</span></div>
      <button class="star ${isFav("h",L.id)?"on":""}" data-fh="${L.id}">${isFav("h",L.id)?"★":"☆"}</button>
    </div>`).join("")||`<div class="empty">Sonuç bulunamadı.</div>`}</div>
  ${ls.length>60?`<div class="more">${ls.length} hattan ilk 60'ı gösteriliyor, aramayı daralt.</div>`:""}`;
}

function viewLine(){
  const L=LINES.find(x=>x.id===state.line); if(!L) return "";
  const di=Math.min(state.dir,L.dir.length-1), x=L.dir[di], now=nowMin();
  const nx=nextAt(x,0,now,3);
  const seg=L.dir.length>1?`<div class="seg">${L.dir.map((d,i)=>`<button class="${i===di?"on":""}" data-dir="${i}">${esc(d.h||STOPS[d.s[d.s.length-1]]?.n||"Yön "+(i+1))} yönü</button>`).join("")}</div>`:"";
  return `<button class="back" data-back>‹ Geri</button>
  <div class="hero"><div class="row">${badge(L)}<div style="flex:1;min-width:0"><h2>${esc(L.n)}</h2><p>${tad(L)}${L.a?" · "+esc(L.a):""} · ${x.s.length} durak · ~${Math.round(x.o[x.o.length-1])} dk</p></div>
    <button class="star ${isFav("h",L.id)?"on":""}" data-fh="${L.id}">${isFav("h",L.id)?"★":"☆"}</button></div>${seg}
    <div class="next">${nx.length?nx.map(t=>`<div><b>${inMin(t)}</b><span>${fmt(t)} kalkış</span></div>`).join(""):`<div><b>—</b><span>Bugün sefer kalmadı</span></div>`}</div>
  </div>
  <h3 class="sec" style="margin-top:0">Duraklar · sıradaki geçiş saati</h3>
  <div class="stops" style="--c:${lc(L)}">${x.s.map((sid,pos)=>{
    const S=STOPS[sid]; if(!S) return ""; const t=nextAt(x,pos,now)[0];
    const others=linesAtName(S.n).filter(o=>o!==L).slice(0,6);
    return `<button class="stop" data-stop="${esc(S.n)}"><span class="dot"></span><span class="nm">${esc(S.n)}${others.length?`<div class="mini" style="margin-top:3px">${others.map(mini).join("")}</div>`:""}</span><span class="tm">${t!==undefined?fmt(t):""}</span></button>`}).join("")}</div>`;
}

function viewStops(){
  const q=norm(state.q);
  const sc=n=>{const x=norm(n);return x===q?0:x.startsWith(q)?1:2;};
  const ns=q?NAMES.filter(n=>norm(n).includes(q)).sort((a,b)=>sc(a)-sc(b)||a.length-b.length):NAMES;
  return `<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
  <input id="q" placeholder="Durak ara: Kadıköy, Taksim…" value="${esc(state.q)}" autocomplete="off"></div>
  <div class="list">${ns.slice(0,50).map(n=>`
    <div class="item" data-stop="${esc(n)}"><div class="t"><b>${esc(n)}</b><div class="mini" style="margin-top:4px">${linesAtName(n).slice(0,8).map(mini).join("")}</div></div>
    <button class="star ${isFav("d",n)?"on":""}" data-fd="${esc(n)}">${isFav("d",n)?"★":"☆"}</button></div>`).join("")||`<div class="empty">Durak bulunamadı.</div>`}</div>
  ${ns.length>50?`<div class="more">${ns.length} duraktan ilk 50'si gösteriliyor, aramayı daralt.</div>`:""}`;
}

function viewStop(){
  const n=state.stop, now=nowMin(), deps=[];
  (BYNAME[n]||[]).forEach(id=>(IDX[id]||[]).forEach(([li,di,pos])=>{
    const L=LINES[li], x=L.dir[di]; if(pos>=x.s.length-1) return;
    const t=nextAt(x,pos,now,2); if(!t.length) return;
    deps.push({L,di,t,yon:x.h||STOPS[x.s[x.s.length-1]]?.n||""});
  }));
  deps.sort((a,b)=>a.t[0]-b.t[0]);
  return `<button class="back" data-back>‹ Geri</button>
  <div class="hero"><div class="row"><div style="flex:1"><h2>${esc(n)}</h2><p>${linesAtName(n).length} hat · saatler tarifeye göre</p></div>
  <button class="star ${isFav("d",n)?"on":""}" data-fd="${esc(n)}">${isFav("d",n)?"★":"☆"}</button></div>
  <button class="btn" style="width:100%;margin-top:12px" data-goto="${esc(n)}">Buraya nasıl giderim?</button></div>
  <div class="stops">${deps.slice(0,30).map(x=>`
    <div class="dep" data-line="${x.L.id}" data-d="${x.di}">${badge(x.L)}
      <div class="t"><b>${esc(x.yon)} yönü</b><span>${x.L.t==="minibus"||x.L.t==="dolmus"?esc(x.L.n)+" · ":""}Sonraki: ${x.t.map(fmt).join(", ")}</span></div>
      <div class="m">${inMin(x.t[0])}<small>kaldı</small></div></div>`).join("")||`<div class="empty">Bugün sefer kalmadı.</div>`}</div>`;
}

function viewFav(){
  const hs=LINES.filter(L=>isFav("h",L.id));
  return `<h3 class="sec">Hatlar</h3><div class="list">${hs.map(L=>`
    <div class="item" data-line="${L.id}">${badge(L)}<div class="t"><b>${esc(L.n)}</b><span>${tad(L)}</span></div>
    <button class="star on" data-fh="${L.id}">★</button></div>`).join("")||`<div class="empty">Hat sayfasında ☆'a dokunarak ekle.</div>`}</div>
  <h3 class="sec">Duraklar</h3><div class="list">${fav.d.map(n=>`
    <div class="item" data-stop="${esc(n)}"><div class="t"><b>${esc(n)}</b><div class="mini" style="margin-top:4px">${linesAtName(n).slice(0,8).map(mini).join("")}</div></div>
    <button class="star on" data-fd="${esc(n)}">★</button></div>`).join("")||`<div class="empty">Durak sayfasında ☆'a dokunarak ekle.</div>`}</div>`;
}

// ================= HARİTA =================
let map, lineLayer, stopLayer, vehLayer, routeLayer, mkA, mkB;
const M={A:null,B:null,mode:"B",plans:null,sel:0};
const DEMO_LOC=[41.0369,28.9850]; // Taksim
function initMap(){
  map=L.map("map",{zoomControl:true,preferCanvas:true}).setView([41.03,29.0],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  lineLayer=L.layerGroup().addTo(map); stopLayer=L.layerGroup(); vehLayer=L.layerGroup().addTo(map); routeLayer=L.layerGroup().addTo(map);
  // Raylı sistem ve vapur hatları her zaman görünür
  LINES.forEach(Ln=>{ if(Ln.t==="minibus"||Ln.t==="dolmus") return;
    const x=Ln.dir[0], pts=x.g||x.s.map(s=>STOPS[s]?.p).filter(Boolean);
    L.polyline(pts,{color:lc(Ln),weight:Ln.t==="vapur"?2:4,opacity:.75,dashArray:Ln.t==="vapur"?"6 6":null}).bindTooltip(Ln.b+" · "+Ln.n).addTo(lineLayer);
  });
  Object.values(STOPS).forEach(S=>{
    L.circleMarker(S.p,{radius:4,color:"#333",weight:1,fillColor:"#fff",fillOpacity:1})
      .bindPopup(`<div class="pop"><b>${esc(S.n)}</b><button data-pop-go="${S.id}">Buraya git</button><button class="g" data-pop-from="${S.id}">Buradan</button><button class="g" data-pop-stop="${esc(S.n)}">Saatler</button></div>`)
      .addTo(stopLayer);
  });
  map.on("zoomend",()=>{ if(map.getZoom()>=15) stopLayer.addTo(map); else stopLayer.remove(); drawVehicles(); });
  map.on("moveend",drawVehicles);
  map.on("click",e=>setPoint([e.latlng.lat,e.latlng.lng]));
  drawVehicles(); setInterval(drawVehicles,3000);
}
// Tarifeye göre tahmini araç konumları (görünür alandakiler)
function drawVehicles(){
  if(!map||document.getElementById("mapview").hidden) return;
  vehLayer.clearLayers();
  const now=nowMin(), b=map.getBounds().pad(.1), z=map.getZoom(), sel=M.plans&&M.plans[M.sel];
  const only=sel&&!sel.walk?new Set(sel.legs.map(l=>l.li)):null;
  LINES.forEach((Ln,li)=>{
    if(only&&!only.has(li)) return;
    if(!only&&z<14&&(Ln.t==="minibus"||Ln.t==="dolmus")) return;
    Ln.dir.forEach(x=>{
      const a=depsToday(x), dur=x.o[x.o.length-1];
      let lo=0,hi=a.length; const t0=now-dur; while(lo<hi){const m=(lo+hi)>>1; if(a[m]<t0) lo=m+1; else hi=m;}
      for(let k=lo;k<a.length&&a[k]<=now;k++){
        const e=now-a[k]; let i=0; while(i<x.o.length-2&&x.o[i+1]<e) i++;
        const A=STOPS[x.s[i]], B=STOPS[x.s[i+1]]; if(!A||!B) continue;
        const span=(x.o[i+1]-x.o[i])||1, f=Math.min(1,Math.max(0,(e-x.o[i])/span));
        const p=[A.la+(B.la-A.la)*f, A.lo+(B.lo-A.lo)*f]; if(!b.contains(p)) continue;
        L.circleMarker(p,{radius:6,color:"#fff",weight:2,fillColor:lc(Ln),fillOpacity:1}).bindTooltip(Ln.b+" · tahmini konum").addTo(vehLayer);
      }
    });
  });
}
const msg=t=>document.getElementById("msg").textContent=t;
function setMode(m){ M.mode=m; document.querySelectorAll("[data-act=A],[data-act=B]").forEach(b=>b.classList.toggle("on",b.dataset.act===m)); }
function setPoint(ll,label){
  M[M.mode]=ll;
  if(M.mode==="A"){ setMode("B"); }
  drawMarkers(); computePlans();
  msg(!M.A?"Varış seçildi. Şimdi \"Konumumu kullan\"a bas ya da A'yı seçip haritaya dokun.":!M.B?"Başlangıç hazır. Gideceğin yeri ara ya da haritada dokun.":"Rota hesaplandı. Bir seçeneğe dokununca haritada görürsün.");
}
function drawMarkers(){
  [mkA,mkB].forEach(m=>m&&m.remove());
  const pin=(t,bg,fg)=>L.divIcon({className:"",html:`<div style="width:28px;height:28px;border-radius:50%;background:${bg};color:${fg};border:3px solid #fff;display:grid;place-items:center;font-weight:800;font:800 13px Inter,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.3)">${t}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
  mkA=M.A&&L.marker(M.A,{icon:pin("A","#0b8a5c","#fff")}).addTo(map);
  mkB=M.B&&L.marker(M.B,{icon:pin("B","#f2b300","#1a1400")}).addTo(map);
}
function useLocation(){
  const fb=why=>{ setMode("A"); setPoint(DEMO_LOC); msg(why+" Şimdilik örnek konum (Taksim) kullanıldı."); map.setView(DEMO_LOC,14); };
  if(!navigator.geolocation) return fb("Bu cihazda konum yok.");
  msg("Konum alınıyor…");
  try{
    navigator.geolocation.getCurrentPosition(p=>{
      const ll=[p.coords.latitude,p.coords.longitude];
      if(hav(ll,[41.02,29.0])>80000) return fb("İstanbul dışında görünüyorsun.");
      setMode("A"); setPoint(ll); map.setView(ll,15);
    },()=>fb("Konum izni verilmedi."),{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  }catch(e){ fb("Konum alınamadı."); }
}

// ================= ROTA HESABI =================
function plan(A,B){
  const now=nowMin(), res=[], dAB=hav(A,B);
  if(dAB<2500) res.push({walk:true,m:Math.round(dAB),arr:now+walkMin(dAB)});
  const O=near(A,900), Dn=near(B,900), dest={};
  Dn.forEach(({id,d})=>(IDX[id]||[]).forEach(([li,di,pos])=>{(dest[li+"|"+di]=dest[li+"|"+di]||[]).push({pos,w:walkMin(d),m:Math.round(d),sid:id});}));
  const bestDest=(li,di,from,tb)=>{const x=LINES[li].dir[di];let best=null;(dest[li+"|"+di]||[]).forEach(e=>{if(e.pos<=from)return;const t=tb+(x.o[e.pos]-x.o[from])+e.w;if(!best||t<best.t)best={t,e};});return best;};
  O.forEach(({id,d})=>{
    const w1=walkMin(d), t0=now+w1;
    (IDX[id]||[]).forEach(([li,di,pos])=>{
      const x=LINES[li].dir[di]; if(pos>=x.s.length-1) return;
      const board=nextAt(x,pos,t0)[0]; if(board===undefined||board-now>90) return;
      const W1={sid:id,m:Math.round(d),w:w1};
      const bd=bestDest(li,di,pos,board);
      if(bd) res.push({legs:[{li,di,from:pos,to:bd.e.pos,board}],w1:W1,w2:bd.e,arr:bd.t});
      for(let k=pos+1;k<x.s.length;k++){
        const tk=board+(x.o[k]-x.o[pos]); if(tk-now>180) break;
        nearStop(x.s[k],300).forEach(({id:id2,d:d2})=>(IDX[id2]||[]).forEach(([l2,d2i,p2])=>{
          if(l2===li||!dest[l2+"|"+d2i]) return;
          const x2=LINES[l2].dir[d2i]; if(p2>=x2.s.length-1) return;
          const b2=nextAt(x2,p2,tk+walkMin(d2)+2)[0]; if(b2===undefined) return;
          const bd2=bestDest(l2,d2i,p2,b2); if(!bd2) return;
          res.push({legs:[{li,di,from:pos,to:k,board},{li:l2,di:d2i,from:p2,to:bd2.e.pos,board:b2}],w1:W1,wt:Math.round(d2),w2:bd2.e,arr:bd2.t});
        }));
      }
    });
  });
  // Aynı araca binip aynı sonuca varan seçeneklerden en sade olanı tut
  const nl=o=>o.legs?o.legs.length:0;
  res.sort((a,b)=>a.arr-b.arr||nl(a)-nl(b)||(a.w1?.w||0)-(b.w1?.w||0));
  const seen=new Set(), out=[];
  // Direkt binilebilen bir araca aktarmayla ulaşmak anlamsız: ilk ayak gereksiz
  const direct=new Set(res.filter(o=>o.legs&&o.legs.length===1).map(o=>{const g=o.legs[0];return g.li+"|"+g.di+"|"+g.from;}));
  for(const o of res){
    if(o.walk){ out.push(o); continue; }
    if(o.legs.length>1){const g=o.legs[o.legs.length-1]; if(direct.has(g.li+"|"+g.di+"|"+g.from)) continue;}
    const last=o.legs[o.legs.length-1], k1=last.li+"@"+Math.round(last.board), k2=o.legs.map(l=>l.li).join(">");
    if(seen.has(k1)||seen.has(k2)) continue;
    seen.add(k1); seen.add(k2); out.push(o);
    if(out.length>=4) break;
  }
  return out;
}
function computePlans(){
  M.plans=(M.A&&M.B)?plan(M.A,M.B):null; M.sel=0; drawRoute(); renderPlans();
}
// Hattın gerçek güzergâhından iki durak arasını kes (yoksa duraklar arası düz çizgi)
function legPath(x,from,to){
  const pts=x.s.slice(from,to+1).map(s=>STOPS[s].p);
  if(!x.g||x.g.length<2) return pts;
  const ni=p=>{let bi=0,bd=1e18;x.g.forEach((q,i)=>{const d=(q[0]-p[0])**2+(q[1]-p[1])**2;if(d<bd){bd=d;bi=i;}});return bi;};
  const a=ni(pts[0]), b=ni(pts[pts.length-1]);
  if(b<=a) return pts;
  return [pts[0],...x.g.slice(a,b+1),pts[pts.length-1]];
}
function drawRoute(){
  routeLayer.clearLayers(); const o=M.plans&&M.plans[M.sel]; if(!o) return drawVehicles();
  const dash=(a,b)=>L.polyline([a,b],{color:"#333",weight:3,dashArray:"2 8",lineCap:"round"}).addTo(routeLayer);
  if(o.walk) dash(M.A,M.B);
  else{
    dash(M.A,STOPS[o.w1.sid].p);
    o.legs.forEach((g,i)=>{const Ln=LINES[g.li],x=Ln.dir[g.di];
      L.polyline(legPath(x,g.from,g.to),{color:lc(Ln),weight:7,opacity:.95}).addTo(routeLayer);
      if(i>0){const prev=o.legs[i-1],px=LINES[prev.li].dir[prev.di];dash(STOPS[px.s[prev.to]].p,STOPS[x.s[g.from]].p);}
    });
    dash(STOPS[o.w2.sid].p,M.B);
  }
  try{ map.fitBounds(L.featureGroup(routeLayer.getLayers()).getBounds().pad(.15)); }catch(e){}
  drawVehicles();
}
function renderPlans(){
  const el=document.getElementById("plans"), now=nowMin();
  if(!M.plans){ el.innerHTML=""; return; }
  if(!M.plans.length){ el.innerHTML=`<div class="empty">Bu iki nokta arasında 1 aktarmayla gidilebilen bir yol bulunamadı. İETT otobüsleri ve metrobüs eklenince seçenekler artacak.</div>`; return; }
  el.innerHTML=M.plans.map((o,k)=>{
    const dur=Math.round(o.arr-now);
    if(o.walk) return `<div class="plan ${k===M.sel?"sel":""}" data-sel="${k}"><h3>Yürüyerek<span>~${dur} dk · varış ${fmt(o.arr)}</span></h3><div class="leg"><div class="walk">🚶</div><p><b>Yürü</b><br><span>${o.m} m</span></p></div></div>`;
    const legs=o.legs.map((g,i)=>{const Ln=LINES[g.li],x=Ln.dir[g.di];
      return (i>0?`<div class="leg"><div class="walk">🚶</div><p>Aktarma<br><span>${o.wt} m yürü</span></p></div>`:"")+
      `<div class="leg">${badge(Ln)}<p><b>${esc(STOPS[x.s[g.from]].n)}</b> → <b>${esc(STOPS[x.s[g.to]].n)}</b><br><span>${esc(Ln.n)} · ${g.to-g.from} durak · <b style="color:var(--ink)">${fmt(g.board)} biniş (${inMin(g.board)})</b></span></p></div>`;}).join("");
    return `<div class="plan ${k===M.sel?"sel":""}" data-sel="${k}"><h3>${k===0?"En hızlı":"Seçenek "+(k+1)}<span>~${dur} dk · varış ${fmt(o.arr)}</span></h3>
      <div class="leg"><div class="walk">🚶</div><p><b>${esc(STOPS[o.w1.sid].n)}</b> durağına yürü<br><span>${o.w1.m} m · ~${o.w1.w} dk</span></p></div>${legs}
      <div class="leg"><div class="walk">🚶</div><p>Varış noktasına yürü<br><span>${o.w2.m} m · ~${o.w2.w} dk</span></p></div></div>`;
  }).join("");
}

// Varış arama kutusu
const dq=document.getElementById("dq"), dsugg=document.getElementById("dsugg");
dq.addEventListener("input",()=>{
  const q=norm(dq.value.trim()); if(q.length<2){dsugg.hidden=true;return;}
  const score=n=>{const x=norm(n);return x===q?0:x.startsWith(q)?1:2;};
  const r=NAMES.filter(n=>norm(n).includes(q)).sort((a,b)=>score(a)-score(b)||a.length-b.length).slice(0,8);
  dsugg.innerHTML=r.map(n=>`<button data-sug="${esc(n)}">${esc(n)} <small>${linesAtName(n).slice(0,3).map(l=>esc(l.b)).join(", ")}</small></button>`).join("")||`<button disabled>Durak bulunamadı</button>`;
  dsugg.hidden=false;
});
dsugg.addEventListener("click",e=>{const b=e.target.closest("[data-sug]");if(!b)return;gotoStopName(b.dataset.sug);});
function gotoStopName(n){
  const S=STOPS[BYNAME[n][0]]; dq.value=n; dsugg.hidden=true;
  setMode("B"); setPoint(S.p); if(!M.A) map.setView(S.p,15);
}

// ================= ÇİZİM =================
const app=document.getElementById("app"), mv=document.getElementById("mapview");
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
  const showMap=state.tab==="rota"&&!state.line&&!state.stop;
  mv.hidden=!showMap; app.hidden=showMap;
  if(showMap){ if(!map) initMap(); setTimeout(()=>{map.invalidateSize();drawVehicles();},0); return; }
  app.innerHTML=state.line?viewLine():state.stop?viewStop():{hatlar:viewLines,duraklar:viewStops,favoriler:viewFav}[state.tab]();
  const q=document.getElementById("q");
  if(q) q.oninput=e=>{state.q=e.target.value;const p=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p);};
}
function openLine(id,d){ hist.push({line:state.line,stop:state.stop,dir:state.dir,tab:state.tab}); go({line:id,stop:null,dir:+(d||0)}); }
function openStop(n){ hist.push({line:state.line,stop:state.stop,dir:state.dir,tab:state.tab}); go({stop:n,line:null}); }
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-sel],[data-fh],[data-fd],[data-f],[data-dir],[data-back],[data-line],[data-stop],[data-goto],[data-pop-go],[data-pop-from],[data-pop-stop]"); if(!el) return;
  const ds=el.dataset;
  if(ds.act){ const a=ds.act;
    if(a==="loc") return useLocation();
    if(a==="A"||a==="B"){ setMode(a); return msg(a==="A"?"Başlangıç için haritaya dokun.":"Varış için haritaya dokun ya da yukarıdan ara."); }
    if(a==="clear"){ M.A=M.B=M.plans=null; setMode("B"); drawMarkers(); routeLayer.clearLayers(); renderPlans(); dq.value=""; return msg("Temizlendi."); }
  }
  if(ds.popGo){ map.closePopup(); setMode("B"); return setPoint(STOPS[ds.popGo].p); }
  if(ds.popFrom){ map.closePopup(); setMode("A"); return setPoint(STOPS[ds.popFrom].p); }
  if(ds.popStop){ map.closePopup(); return openStop(ds.popStop); }
  if(ds.sel!==undefined){ M.sel=+ds.sel; drawRoute(); return renderPlans(); }
  if(ds.fh){ e.stopPropagation(); return toggleFav("h",ds.fh); }
  if(ds.fd!==undefined){ e.stopPropagation(); return toggleFav("d",ds.fd); }
  if(ds.f) return go({filtre:ds.f});
  if(ds.dir!==undefined) return go({dir:+ds.dir});
  if(ds.goto){ hist=[]; go({tab:"rota",line:null,stop:null}); return gotoStopName(ds.goto); }
  if(el.hasAttribute("data-back")) return go(hist.pop()||{line:null,stop:null});
  if(ds.line) return openLine(ds.line,ds.d);
  if(ds.stop!==undefined) return openStop(ds.stop);
});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{hist=[];go({tab:b.dataset.tab,line:null,stop:null,q:""});});
setInterval(()=>{ if(!app.hidden&&(!document.activeElement||document.activeElement.tagName!=="INPUT")) render(); },30000);

loadData().then(render).catch(e=>{app.innerHTML=`<div class="empty">Veri yüklenemedi: ${esc(e.message)}</div>`;});
</script>
